version: 2
updates:
  # Enable version updates for NuGet packages
  - package-ecosystem: "nuget"
    # Recursive: `directory` matches one exact folder and the repo root holds no manifest,
    # which is why nuget updates never opened. This picks up /src and anything added later.
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
