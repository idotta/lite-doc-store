name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore LiteDocumentStore.slnx

      - name: Build
        run: dotnet build LiteDocumentStore.slnx --no-restore --configuration Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test LiteDocumentStore.slnx --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/LiteDocumentStore/LiteDocumentStore.csproj --no-build --configuration Release --output . -p:Version=${{ env.VERSION }} -p:PackageVersion=${{ env.VERSION }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.nupkg'

      - name: Push package to NuGet
        run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push "*.snupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
